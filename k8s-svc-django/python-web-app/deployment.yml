apiVersion: apps/v1
kind: Deployment
metadata:
  name: sample-djago-app-deployment
  labels:
    app: sample-django-app-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: sample-django-app-deployment
  template:
    metadata:
      labels:
        app: sample-django-app-deployment
    spec:
      containers:
      - name: django-app
        image: python-django-sample:v1
        ports:
        - containerPort: 8000

